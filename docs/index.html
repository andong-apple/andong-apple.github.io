<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사과농장 주문</title>
<meta name="description" content="정성껏 키운 햇사과, 여기서 주문하세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="사과농장 주문">
<meta property="og:description" content="정성껏 키운 햇사과, 여기서 주문하세요.">
<meta property="og:url" content="https://andong-apple.github.io/">
<meta name="theme-color" content="#d8e86a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍎</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{--lime:#d8e86a;--lime2:#d4e65c;--soft:#eef7d3;--olive:#8a9a16;--ink:#1d2b1d;--org:#ff7f00;--bg:#f4f2ea;--line:#d9d7cc}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,-apple-system,sans-serif;background:#e9e8df;color:var(--ink);font-size:16px}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:96px;position:relative}
header{position:sticky;top:0;z-index:5;background:var(--lime);height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:20px}
header b{font-weight:800;letter-spacing:-.5px}
button{font:inherit;cursor:pointer;border:0}
.lnk{background:none;font-size:13px;color:#3a4a10;text-decoration:underline}
.hero{width:100%;display:block;max-height:320px;object-fit:cover}
.card{margin:14px;background:var(--soft);border-radius:14px;overflow:hidden}
.card.w{background:#fff;padding:16px}
.top{padding:18px 16px 6px}
h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.intro{margin-top:6px;font-size:14.5px;line-height:1.55;color:#3d4a2d}
.opts{background:var(--lime2);margin-top:14px;padding:4px 16px}
.opt{padding:12px 0;border-bottom:1px solid rgba(60,80,0,.25);display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.opt:last-child{border:0}.opt b{font-size:17px;font-weight:600}
.tag{display:inline-block;margin-left:8px;background:var(--olive);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px;vertical-align:2px}
.opt .d{text-align:right;font-size:17px;font-weight:500}
.opt .p{font-size:14px;color:#3d4a10;font-weight:700}
.opt .st{font-size:12px;font-weight:700;text-align:right}
.opt .st.ok{color:#4a5a10}.opt .st.low{color:#b35900}.opt .st.out{color:#c00}
.ship{padding:12px 16px;font-size:14px;font-weight:700;color:#4a5a10}
.body{background:#fbfbf6;margin:0 14px;border-radius:14px;padding:6px 18px}
.body h2{font-size:20px;font-weight:800;margin:22px 0 12px;color:#1d3320;letter-spacing:-.4px}
.body ul{padding-left:20px}.body li{font-size:16px;line-height:1.5;margin:8px 0}
.body hr{border:0;border-top:1px solid #333;margin:20px 0 0}.body hr:last-child{display:none}
.lbl{font-size:13px;color:#667;margin-bottom:6px;font-weight:600}
.acc{font-size:18px;font-weight:700}.acc small{display:block;font-size:14px;font-weight:500;color:#555;margin-top:4px}
.sold{color:#c00;font-weight:800;text-align:center;padding:10px;font-size:18px}
.f{margin:0 0 14px}.f label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}input:disabled,select:disabled{background:#eee}
.lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.f .lh label{margin:0}
.chk{display:flex!important;align-items:center;gap:6px;font-size:14px!important;color:#4a5a10;cursor:pointer}
.chk input{width:20px;height:20px;margin:0;padding:0;accent-color:var(--olive)}
input[readonly]{background:#f3f3ec;color:#555}
.cpy{background:none;padding:0;text-align:left;color:inherit;font-size:13px}.cpy i{font-style:normal;margin-left:6px;padding:1px 6px;border-radius:99px;background:#eef0e0;font-size:11px;font-weight:700;color:#4a5a10}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:17px}
.btn.sm{padding:6px 12px;font-size:13px}
.zr{display:flex;gap:8px;margin-bottom:8px}.zr input{flex:1;min-width:0}.zr button{white-space:nowrap}
.qline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:10px 12px;background:#eef0e0;border-radius:10px;font-size:14px}.qline b{font-size:16px}.qline small{color:#777;font-size:12px;width:100%}.qline.bad{background:#fde8e8;color:#c00}
.addrc{margin:0 14px 14px}.addrc .btn{width:100%;padding:14px;border-style:dashed;font-size:15px}.addrc .hint{text-align:center}
#rc.off{opacity:.6}
.pc{position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column}.pch{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid #eee}.pcb{flex:1;min-height:0}
tr.sub td{border-top:0;background:#fafaf5}
.ph{display:flex;gap:8px;align-items:center}.ph span{padding:12px 14px;background:#eef0e0;border-radius:10px;font-weight:700}
.row{display:flex;gap:8px}.row>*{flex:1}
.cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #eee;z-index:6}
.cta button{width:100%;height:54px;border-radius:12px;background:var(--org);color:#fff;font-size:18px;font-weight:800}
.cta button:disabled{background:#bbb}
.btn{padding:11px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px}
.btn.g{background:var(--olive);color:#fff;border:0}.btn.r{color:#c33}
.tabs{display:flex;background:#fff;border-bottom:1px solid #eee;position:sticky;top:54px;z-index:4}
.tabs button{flex:1;padding:14px 0;background:none;font-weight:600;color:#777;border-bottom:3px solid transparent}
.tabs .on{color:#111;border-color:#111;font-weight:800}
.tw{overflow-x:auto;background:#fff;border-radius:10px}table{border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:9px 10px;border-bottom:1px solid #eee;text-align:left}th{background:#eef0e0;position:sticky;top:0}
.stbtn{padding:3px 8px;border-radius:99px;background:#eee;font-size:12px;font-weight:700}.stbtn.ok{background:var(--olive);color:#fff}
.box{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px}
.box .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.hint{font-size:12px;color:#888;margin-top:4px;line-height:1.4}
.pv{position:fixed;top:60px;right:10px;z-index:9;background:#111;color:#fff;padding:10px 14px;border-radius:99px;font-weight:700;font-size:13px}
.done{text-align:center;padding:60px 24px}.done h1{margin-bottom:12px}.done p{line-height:1.7;margin:6px 0}
.tel{color:#1a5fb4;font-weight:700;text-decoration:underline}
.done .shipnote{display:inline-block;margin:10px 0;padding:8px 14px;border-radius:10px;background:var(--soft);color:#4a5a10;font-weight:700;font-size:15px}
.ver{text-align:center;color:#aaa;font-size:11px;padding:10px 0 6px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;display:none}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.mb{background:#fff;border-radius:16px;width:100%;max-width:340px;padding:22px 20px 16px}
.mb p{font-size:16px;line-height:1.55;margin-bottom:14px;word-break:keep-all}
.mb .bt{display:flex;gap:8px;margin-top:14px}.mb .bt button{flex:1;height:46px;border-radius:10px;font-weight:800;font-size:15px;background:#eef0e0;color:var(--ink)}
.mb .bt .ok{background:var(--org);color:#fff}
</style></head>
<body><div id="app"></div><div id="toast"></div>
<script>
const S={cfg:null,ver:'',token:null,tab:'orders',data:null,rid:Math.random().toString(36).slice(2)+Date.now()};
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const nl=s=>esc(s).replace(/\n/g,'<br>');
/* 구글 앱스스크립트 서버 주소 (배포 주소가 바뀌지 않도록 clasp로 같은 배포를 업데이트함) */
const API='https://script.google.com/macros/s/AKfycbxkK0MdcI7WfoLM6kD601azygIwlVaNBXRgf_iEAjL8p-KUXJfKEVXRA38O3l1WpwY/exec';
// text/plain으로 보내야 브라우저의 사전 확인 요청(CORS) 없이 바로 전달됨
const run=async(fn,...args)=>{
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})});
  const j=await r.json();if(!j.ok)throw new Error(j.error);return j.data};
const isKakao=/KAKAOTALK/i.test(navigator.userAgent);
const openOut=()=>{location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href)};
/* 구글 드라이브 공유 링크를 그대로 붙여넣어도 사진이 보이도록 변환 */
const img=u=>{const m=/drive\.google\.com\/.*(?:\/d\/|[?&]id=)([\w-]{20,})/.exec(u||'');return m?'https://lh3.googleusercontent.com/d/'+m[1]:u};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* 인앱 안내창 (브라우저 기본 alert/confirm/prompt 대신 사용 - 주소 표시줄 문구 없이 깔끔하게) */
function modal(msg,o){o=o||{};return new Promise(res=>{
  const m=document.createElement('div');m.className='mo';
  m.innerHTML=`<div class="mb"><p>${nl(msg)}</p>${o.input?`<input id="mi" type="${o.type||'text'}" value="${esc(o.val||'')}" ${o.type==='number'?'inputmode="numeric"':''} autocomplete="off">`:''}<div class="bt">${o.input||o.confirm?'<button id="mc">취소</button>':''}<button class="ok" id="mk">확인</button></div></div>`;
  document.body.appendChild(m);const i=m.querySelector('#mi');if(i)i.focus();
  const done=v=>{m.remove();res(v)};
  m.querySelector('#mk').onclick=()=>done(o.input?i.value:true);
  const c=m.querySelector('#mc');if(c)c.onclick=()=>done(o.input?null:false);
  if(i)i.onkeydown=e=>{if(e.key==='Enter')done(i.value)};
});}
const A=m=>modal(m),C=m=>modal(m,{confirm:1}),P=(m,t,v)=>modal(m,{input:1,type:t,val:v});

/* 지난번 상품 정보로 화면을 즉시 보여주고, 서버의 최신 정보가 오면 입력값을 유지한 채 갱신 */
async function load(keep){
  let c=null;try{c=JSON.parse(localStorage.getItem('pub'))}catch(e){}
  if(keep)c=c||{};
  else if(c&&c.cfg){S.cfg=c.cfg;S.ver=c.ver;buyer()}else{S.view='';app.innerHTML='<div class="done"><p>불러오는 중...</p></div>'}
  try{
    const r=await run('getPublic');S.cfg=r.cfg;S.ver=r.ver;
    try{localStorage.setItem('pub',JSON.stringify(r))}catch(e){}
    if(!c||(S.view==='buyer'&&!document.querySelector('.mo')))buyer(false,!!c);
  }catch(e){
    if(!c)app.innerHTML=`<div class="done"><p>불러오지 못했습니다.</p><p><button class="btn" onclick="location.reload()">새로고침</button></p>${isKakao?'<p><button class="btn g" onclick="openOut()">다른 브라우저로 열기</button></p>':''}</div>`;
  }
}
const stLabel=n=>n<=0?['out','품절']:n<=5?['low','잔여 '+n+'개']:['ok','잔여 '+n+'개'];

/* ---------------- 구매자 화면 ---------------- */
const FORM=['opt','qty','date','name','phone'];
/* 받는 곳 목록은 화면이 다시 그려져도 유지되도록 S.rc에 보관. 첫 번째 받는 곳은 '나머지 수량'을 자동으로 받음 */
const blankRc=()=>({rname:'',rphone:'',zip:'',addr:'',detail:'',qty:1});
const fmtPh=v=>{const d=String(v).replace(/\D/g,'').slice(0,8);return d.length>4?d.slice(0,4)+'-'+d.slice(4):d};
const fullPh=v=>{const d=String(v).replace(/\D/g,'');return '010-'+d.slice(0,4)+'-'+d.slice(4)};
const totalQty=()=>Number((document.getElementById('qty')||{}).value)||1;
const restQty=()=>totalQty()-S.rc.slice(1).reduce((n,r)=>n+(Number(r.qty)||0),0);
function buyer(preview,keep){
  const kept={};if(keep)FORM.forEach(id=>{const el=document.getElementById(id);if(el)kept[id]=el.value});
  if(!S.rc)S.rc=[blankRc()];
  S.view=preview?'preview':'buyer';
  const c=S.cfg,anyLeft=c.options.some(o=>(Number(o.stock)||0)>0),out=!anyLeft&&!preview;
  app.innerHTML=`<header><b>사과농장</b>${preview?'':'<button class="lnk" id="adm">판매자 로그인</button>'}</header>
  ${preview?'<button class="pv" id="back">편집으로 돌아가기</button>':''}
  ${c.hero?`<img class="hero" src="${esc(img(c.hero))}" alt="" onerror="this.remove()">`:''}
  <section class="card"><div class="top"><h1>${esc(c.name)}</h1><p class="intro">${nl(c.intro)}</p></div>
    <div class="opts">${c.options.map(o=>{const s=stLabel(Number(o.stock)||0);return `<div class="opt"><div><b>${esc(o.name)}</b>${o.tag?`<span class="tag">${esc(o.tag)}</span>`:''}</div><div class="d">${esc(o.desc)}</div><div class="p">${won(o.price)}</div><div class="st ${s[0]}">${s[1]}</div></div>`}).join('')}</div>
    ${c.ship?`<div class="ship">${esc(c.ship)}</div>`:''}</section>
  ${c.sections.length?`<section class="body">${c.sections.map(s=>`<h2>${esc(s.title)}</h2><ul>${s.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><hr>`).join('')}</section>`:''}
  <section class="card w"><div class="lbl">입금 계좌</div><div class="acc">${esc(c.bank.bank)} ${esc(c.bank.no)}<small>예금주 ${esc(c.bank.holder)}</small></div>${c.contact?`<div class="lbl" style="margin-top:12px">문의</div><div class="acc" style="font-size:15px;font-weight:500">${esc(c.contact)}</div>`:''}</section>
  <section class="card w">${out?'<div class="sold">품절되었습니다</div>':''}
    <div class="f"><label>옵션 선택</label><select id="opt" ${out?'disabled':''}>${c.options.map((o,i)=>{const st=Number(o.stock)||0;return `<option value="${i}" ${st<=0?'disabled':''}>${esc(o.name)} - ${won(o.price)}${st<=0?' (품절)':''}</option>`}).join('')}</select></div>
    <div class="f"><label>총 수량</label><select id="qty" ${out?'disabled':''}></select></div>
    <div class="f"><label>입금일자</label><input type="date" id="date" value="${today()}" ${out?'disabled':''}></div>
    <div class="f"><label>입금자명</label><input id="name" maxlength="30" placeholder="입금자명" ${out?'disabled':''}></div>
    <div class="f" style="margin:0"><label>연락처</label><div class="ph"><span>010</span><input id="phone" inputmode="numeric" maxlength="9" placeholder="0000-0000" ${out?'disabled':''}></div></div>
  </section>
  <div id="rc" class="${out?'off':''}"></div>
  <div class="cta"><button id="go" ${out||preview?'disabled':''}>${out?'품절되었습니다':'입금완료 후 주문신청'}</button></div>`;
  if(preview){document.getElementById('back').onclick=()=>admin();renderRc(true);return}
  document.getElementById('adm').onclick=openLogin;
  const $=id=>document.getElementById(id),ph=$('phone'),nm=$('name');
  ph.oninput=()=>{ph.value=fmtPh(ph.value);syncSame()};nm.oninput=syncSame;
  const optEl=$('opt'),qtyEl=$('qty');
  function fillQty(){const o=c.options[optEl.value],cap=Number(c.maxQty)||10,max=Math.max(1,Math.min(cap,o?(Number(o.stock)||0):0));const v=qtyEl.value;qtyEl.innerHTML=Array.from({length:max},(_,i)=>`<option>${i+1}</option>`).join('');if(v&&v<=max)qtyEl.value=v}
  optEl.onchange=()=>{fillQty();renderRc()};qtyEl.onchange=()=>renderRc();fillQty();
  if(keep){FORM.forEach(id=>{if(kept[id]==null)return;const el=$(id);
    if(id==='opt'&&!(el.options[kept[id]]&&!el.options[kept[id]].disabled))return;
    el.value=kept[id];if(id==='opt')fillQty()});if(!qtyEl.value)qtyEl.selectedIndex=0}
  renderRc(out);
  $('go').onclick=submit;
}
/* '입금자와 동일'이 체크돼 있으면 첫 번째 받는 곳의 이름·연락처를 입금자 정보로 맞춤 */
function syncSame(){
  if(!S.same)return;const r=S.rc[0],$=id=>document.getElementById(id);
  r.rname=$('name').value;r.rphone=$('phone').value;
  const a=document.querySelector('[data-r="0"][data-f="rname"]'),b=document.querySelector('[data-r="0"][data-f="rphone"]');
  if(a)a.value=r.rname;if(b)b.value=r.rphone;
}
function renderRc(off){
  const box=document.getElementById('rc');if(!box)return;
  const dis=off?'disabled':'',total=totalQty();
  S.rc.forEach((r,k)=>{if(k)r.qty=Math.min(Number(r.qty)||1,Math.max(1,total-1))});
  const rest=restQty(),many=S.rc.length>1;
  box.innerHTML=S.rc.map((r,k)=>{const ro=k===0&&S.same?'readonly':'';return `<section class="card w rcard">
    <div class="rh"><b>${many?`받는 곳 ${k+1}`:'받는 곳'}</b>${k===0?`<label class="chk"><input type="checkbox" id="same" ${S.same?'checked':''} ${dis}>입금자와 동일</label>`:`<button class="btn r sm" data-del="${k}" ${dis}>삭제</button>`}</div>
    <div class="f"><label>받는 사람</label><input data-r="${k}" data-f="rname" maxlength="30" placeholder="받는 사람 이름" value="${esc(r.rname)}" ${ro} ${dis}></div>
    <div class="f"><label>받는 사람 연락처</label><div class="ph"><span>010</span><input data-r="${k}" data-f="rphone" inputmode="numeric" maxlength="9" placeholder="0000-0000" value="${esc(r.rphone)}" ${ro} ${dis}></div></div>
    <div class="f"><label>배송지 주소</label>
      ${S.manual?'':`<div class="zr"><input data-r="${k}" data-f="zip" placeholder="우편번호" value="${esc(r.zip)}" readonly ${dis}><button class="btn g" data-find="${k}" ${dis}>주소 검색</button></div>`}
      <input data-r="${k}" data-f="addr" placeholder="${S.manual?'주소':'주소 검색을 눌러 주세요'}" value="${esc(r.addr)}" ${S.manual?'':'readonly'} ${dis} style="margin-bottom:8px">
      <input data-r="${k}" data-f="detail" maxlength="80" placeholder="상세주소 (동·호수 등)" value="${esc(r.detail)}" ${dis}></div>
    ${!many?'':k===0?`<div class="qline ${rest<1?'bad':''}">보낼 수량 <b>${rest<1?'수량 부족':rest+'개'}</b><small>총 수량에서 다른 받는 곳을 뺀 나머지</small></div>`
      :`<div class="f" style="margin:0"><label>보낼 수량</label><select data-r="${k}" data-f="qty" ${dis}>${Array.from({length:Math.max(1,total-1)},(_,i)=>`<option ${r.qty==i+1?'selected':''}>${i+1}</option>`).join('')}</select></div>`}
  </section>`}).join('')+`<div class="addrc">${rest>1||!many&&total>1?`<button class="btn" id="addrc" ${dis}>+ 받는 곳 추가 (선물 보내기)</button>`:`<p class="hint">${total>1?'남은 수량이 없어 받는 곳을 더 추가할 수 없습니다.':'총 수량을 2개 이상으로 하면 다른 곳에도 보낼 수 있습니다.'}</p>`}</div>`;
  if(off)return;
  box.querySelectorAll('[data-f]').forEach(el=>el[el.tagName==='SELECT'?'onchange':'oninput']=()=>{
    const r=S.rc[el.dataset.r],f=el.dataset.f;

  box.querySelectorAll('[data-find]').forEach(b=>b.onclick=()=>findAddr(Number(b.dataset.find)));

async function findAddr(k){
  try{await postLib()}catch(e){S.manual=true;renderRc();await A('주소 검색을 불러오지 못했습니다. 주소를 직접 입력해 주세요.');return}
  const m=document.createElement('div');m.className='pc';

    S.rc[k].zip=d.zonecode;S.rc[k].addr=a;m.remove();renderRc();

async function submit(){
  const v=id=>document.getElementById(id).value.trim();
  const d=v('phone').replace(/\D/g,'');
  if(!v('name')||!v('date')){await A('입금일자와 입금자명을 입력해 주세요.');return}
  if(d.length!==8){await A('연락처 11자리를 정확히 입력해 주세요.');return}
  syncSame();
  const many=S.rc.length>1,rest=restQty();
  for(let k=0;k<S.rc.length;k++){const r=S.rc[k],no=many?`받는 곳 ${k+1}의 `:'';
    if(!r.rname.trim()){await A(no+'받는 사람 이름을 입력해 주세요.');return}
    if(r.rphone.replace(/\D/g,'').length!==8){await A(no+'받는 사람 연락처 11자리를 정확히 입력해 주세요.');return}
    if(!r.addr.trim()){await A(no+'배송지 주소를 입력해 주세요.');return}}
  if(rest<1){await A('받는 곳별 보낼 수량의 합이 총 수량보다 많습니다. 수량을 확인해 주세요.');return}
  const opt=S.cfg.options[v('opt')],qty=Number(v('qty'));
  const recips=S.rc.map((r,k)=>({rname:r.rname.trim(),rphone:fullPh(r.rphone),zip:r.zip,addr:r.addr.trim(),detail:r.detail.trim(),qty:k===0?rest:r.qty}));
  const list=recips.map((r,k)=>`${many?(k+1)+'. ':''}${r.rname} ${many?r.qty+'개':''}\n   ${r.addr} ${r.detail}`).join('\n');
  if(!await C(`${opt.name} 총 ${qty}개\n합계 ${won(opt.price*qty)}\n\n받는 곳\n${list}\n\n입금을 완료하셨나요? 주문을 신청합니다.`))return;
  const b=document.getElementById('go');b.disabled=true;b.textContent='접수 중...';
  try{
    const r=await run('submitOrder',{rid:S.rid,optIdx:Number(v('opt')),qty,date:v('date'),name:v('name'),phone:fullPh(d),recips});
    S.rid=Math.random().toString(36).slice(2)+Date.now();
    if(!r.ok){await A(r.msg);b.disabled=false;b.textContent='입금완료 후 주문신청';load(true);return}
    S.rc=null;S.same=false;
    S.view='done';app.innerHTML=`<header><b>사과농장</b></header><div class="done"><h1>주문이 접수되었습니다</h1><p>주문번호 ${esc(r.id)}</p><p>합계 ${won(r.total)}${many?` · 받는 곳 ${recips.length}곳`:''}</p><p>입금이 확인되면 순서대로 보내 드립니다.</p>${S.cfg.ship?`<p class="shipnote">${esc(S.cfg.ship)}</p>`:''}<p>감사합니다.</p><p style="margin-top:28px"><button class="btn g" id="again" style="padding:14px 24px;font-size:16px">주문 페이지로 돌아가기</button></p></div>`;
    document.getElementById('again').onclick=()=>{scrollTo(0,0);load()};
  }catch(e){await A('오류: '+(e.message||e));b.disabled=false;b.textContent='입금완료 후 주문신청'}
}

function setPath(o,p,v){const k=p.split('.');let t=o;for(let i=0;i<k.length-1;i++)t=t[k[i]];t[k[k.length-1]]=v}
function bind(pane){
  pane.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>setPath(S.draft,el.dataset.k,el.dataset.lines?el.value.split('\n').map(s=>s.trim()).filter(Boolean):el.type==='number'?Number(el.value):el.value));
  pane.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a,i=Number(b.dataset.i),d=S.draft;
    if(a==='addo')d.options.push({name:'',tag:'',desc:'',price:0,stock:0});
    if(a==='delo'){if(d.options.length<2)return A('옵션은 1개 이상 필요합니다.');d.options.splice(i,1)}
    if(a==='adds')d.sections.push({title:'',items:[]});
    if(a==='dels')d.sections.splice(i,1);
    if(a==='pv'){const c=S.cfg;S.cfg=S.draft;buyer(true);S.cfg=c;return}
    pEdit();
  });
}
load();
</script></body></html>
